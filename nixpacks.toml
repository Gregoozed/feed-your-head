# Railway build pipeline for the feed-your-head monorepo.
# - install: bootstraps both workspaces (client + server) in one go
# - build:   produces client/dist (served by Express in prod)
# - start:   migrate+seed run automatically at boot via server/src/db/bootstrap.js

[phases.setup]
nixPkgs = ["nodejs_22", "python3"]

[phases.install]
# npm install (not ci): regenerates platform-specific optional deps so the
# Linux rolldown native binding (@rolldown/binding-linux-x64-gnu) is fetched,
# working around npm bug #4828 (lockfile generated on macOS).
cmds = ["npm install --include=dev --include=optional"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80">
  <!-- Horizontal lockup: square mark + "Feed Your Head" wordmark + ocre leaf as final accent.
       Mark sits on a forest tile; wordmark in forest green; final point becomes a small leaf in ocre. -->

  <!-- mark tile -->
  <rect x="0" y="8" width="64" height="64" rx="12" fill="#1a3a2e"/>
  <text x="29" y="56" text-anchor="middle" dominant-baseline="middle"
        font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="600"
        font-size="38" fill="#f5f1ea">F</text>
  <g transform="translate(44,18)" fill="#c47a28" stroke="#c47a28" stroke-linecap="round">
    <line x1="0" y1="12" x2="0" y2="3" stroke-width="1.4" fill="none"/>
    <path d="M 0 7 C -4 5 -5 1 -3 0 C -1 1 0 4 0 7 Z"/>
    <path d="M 0 4 C 4 2 5 -2 3 -3 C 1 -1 0 1 0 4 Z"/>
  </g>

  <!-- wordmark -->
  <text x="84" y="56" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500"
        font-size="32" fill="#1a3a2e" letter-spacing="-0.5">Feed Your Head</text>

  <!-- leaf-accent replacing the usual ocre point -->
  <g transform="translate(348,52)" fill="#c47a28">
    <path d="M 0 0 C 4 -3 9 -3 12 -8 C 9 -2 4 0 0 0 Z"/>
  </g>
</svg>
